<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Narrow text block in a wider column</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 16px; line-height: 24px; margin: 0; }
  section { padding: 0 24px; }
  .inner { box-sizing: border-box; max-width: 1200px; margin: 0 auto; padding: 0 40px; min-height: 240px; }
  .prose { max-width: 444px; margin: 0 auto; min-height: 120px; }
  h1 { font-size: 48px; line-height: 52px; margin: 24px 0 8px; }
</style>
</head>
<body>
<section><div class="inner">
  <h1>Ship faster</h1>
  <div class="prose"><p>A narrow text block centred inside the wider page column, long enough to read.</p></div>
</div></section>
</body>
</html>
