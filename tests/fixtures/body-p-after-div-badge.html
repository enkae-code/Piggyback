<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Body paragraph after a div badge, first screen</title>
<style>
  body { font-family: sans-serif; font-size: 16px; line-height: 24px; margin: 0; }
  .hero { padding: 40px; }
  .badge, .lead { width: 600px; }
</style>
</head>
<body>
<main class="hero">
  <h1>Launch day</h1>
  <div class="badge">New release for small teams, shipped this week.</div>
  <p class="lead">Teams keep the paragraph that explains what the product does and who it is for.</p>
</main>
</body>
</html>
