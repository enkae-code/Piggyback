<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Carousel with slides off the edge</title>
<style>
  body { font-family: sans-serif; font-size: 16px; line-height: 24px; margin: 0; }
  .track { display: flex; gap: 24px; width: 1600px; margin: 0 0 0 -400px; padding: 0; list-style: none; }
  .slide { flex: 0 0 300px; box-sizing: border-box; height: 120px; padding: 16px; background: #eee; border-radius: 12px; }
</style>
</head>
<body>
<ul class="track">
  <li class="slide">Slide one</li>
  <li class="slide">Slide two</li>
  <li class="slide">Slide three</li>
  <li class="slide">Slide four</li>
  <li class="slide">Slide five</li>
</ul>
</body>
</html>
