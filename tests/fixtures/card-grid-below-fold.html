<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Card grids: a larger one below the fold, a smaller one in the first screen</title>
<style>
  body { font-family: sans-serif; font-size: 16px; line-height: 24px; margin: 0; }
  .row { display: flex; gap: 20px; padding: 20px; }
  .card { flex: 0 0 200px; height: 120px; box-sizing: border-box; padding: 16px; background: #eee; }
  .spacer { height: 1000px; }
</style>
</head>
<body>
<section class="row top">
  <div class="card">Top one</div>
  <div class="card">Top two</div>
  <div class="card">Top three</div>
</section>
<div class="spacer"></div>
<section class="row below">
  <div class="card">Below one</div>
  <div class="card">Below two</div>
  <div class="card">Below three</div>
  <div class="card">Below four</div>
</section>
</body>
</html>
