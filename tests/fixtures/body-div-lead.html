<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Body copy in a div, first screen</title>
<style>
  body { font-family: sans-serif; font-size: 16px; line-height: 24px; margin: 0; }
  .hero { padding: 40px; }
  .lead { width: 600px; }
  .spacer { height: 1000px; }
</style>
</head>
<body>
<main class="hero">
  <h1>Launch day</h1>
  <div class="lead">Our new tools help small teams ship without the usual overhead.</div>
</main>
<div class="spacer"></div>
<p>A paragraph far below the first screen, long enough to qualify on its own.</p>
</body>
</html>
