<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Icon tiles</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #ffffff; }
  .tile { width: 48px; height: 48px; display: grid; place-items: center; margin: 8px; }
  .pastel { background: rgb(224, 236, 255); }
  .round { border-radius: 50%; }
  .plain { background: #ffffff; }
  button { padding: 0; border: 0; }
</style>
</head>
<body>
<div class="tile pastel"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></div>
<div class="tile pastel round"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></div>
<button class="tile pastel"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></button>
<div class="tile plain"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></div>
</body>
</html>
