<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Button row</title>
<style>
  body { font-family: sans-serif; font-size: 16px; line-height: 24px; margin: 0; }
  .actions { display: flex; gap: 16px; padding: 24px; }
  .btn { width: 160px; height: 48px; background: #111; color: #fff; border: 0; border-radius: 8px; }
</style>
</head>
<body>
<div class="actions">
  <button class="btn">Get started</button>
  <button class="btn">Read docs</button>
  <button class="btn">Contact sales</button>
</div>
<svg width="700" height="120" viewBox="0 0 700 120">
  <g class="tile"><rect x="0" y="0" width="200" height="100" fill="#ccc"/><text x="10" y="50">One</text></g>
  <g class="tile"><rect x="240" y="0" width="200" height="100" fill="#ccc"/><text x="250" y="50">Two</text></g>
  <g class="tile"><rect x="480" y="0" width="200" height="100" fill="#ccc"/><text x="490" y="50">Three</text></g>
</svg>
</body>
</html>
