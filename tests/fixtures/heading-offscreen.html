<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heading with a word parked off to the side</title>
<style>
  body { margin: 0; font: 16px/24px sans-serif; }
  h1 { font-size: 40px; line-height: 44px; margin: 24px; position: relative; }
  .parked { position: absolute; left: 3000px; }
</style>
</head>
<body>
<h1>Visible heading <span class="parked">next</span></h1>
<p>A body paragraph long enough to be the first body paragraph anchor.</p>
</body>
</html>
