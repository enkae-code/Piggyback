<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Body copy never comes from a heading</title>
<style>
  body { font-family: sans-serif; font-size: 16px; line-height: 24px; margin: 0; }
  .hero { padding: 40px; }
  .lead { width: 600px; }
  h1 { font-size: 40px; line-height: 48px; margin: 0 0 16px; }
</style>
</head>
<body>
<main class="hero">
  <h1><span>Launch day: our new tools help small teams ship faster</span></h1>
  <div class="lead">Teams keep the lead copy here, long enough to qualify on its own.</div>
</main>
</body>
</html>
