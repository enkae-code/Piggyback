<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Full-bleed sections</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 16px; line-height: 24px; margin: 0; }
  section { padding: 0 24px; }
  .wrap { max-width: 1100px; margin: 0 auto; min-height: 200px; }
  .row { width: 600px; }
  h1 { font-size: 48px; line-height: 52px; margin: 24px 0 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .dot { display: block; width: 120px; height: 120px; background: #eee; border-radius: 12px; }
</style>
</head>
<body>
<section><div class="wrap">
  <h1>Ship <span class="sr">Ship </span>faster</h1>
  <p>A body paragraph long enough to be the body anchor on this page for the container test.</p>
</div></section>
<section><div class="row">
  <span class="dot"></span><span class="dot"></span><span class="dot"></span>
</div></section>
</body>
</html>
